name: Ecommerce CI

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{github.sha}}

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Product Service
        run: |
          docker build \
            -t product-service:${IMAGE_TAG} \
            ./services/product-service

      - name: Build Order Service
        run: |
          docker build \
            -t order-service:${IMAGE_TAG} \
            ./services/order-service

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Product Service
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/product-service"
          docker tag "product-service:${IMAGE_TAG}" "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"

      - name: Push Order Service
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/order-service"
          docker tag "order-service:${IMAGE_TAG}" "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"

  deploy:
    name: Deploy to Minikube
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Check Kubernetes
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl get deployments -n ecommerce

      - name: Deploy Product Service
        run: |
          kubectl set image deployment/product-service \
            product-service=ghcr.io/engrsaqi14-sketch/product-service:${IMAGE_TAG} \
            -n ecommerce
          kubectl rollout restart deployment/product-service -n ecommerce
          kubectl rollout status deployment/product-service -n ecommerce --timeout=120s

      - name: Deploy Order Service
        run: |
          kubectl set image deployment/order-service \
            order-service=ghcr.io/engrsaqi14-sketch/order-service:${IMAGE_TAG} \
            -n ecommerce
          kubectl rollout restart deployment/order-service -n ecommerce
          kubectl rollout status deployment/order-service -n ecommerce --timeout=120s
