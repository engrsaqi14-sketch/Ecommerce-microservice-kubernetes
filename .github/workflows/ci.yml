name: Ecommerce CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Product Service
        run: |
          docker build \
            -t product-service:test \
            ./services/product-service

      - name: Build Order Service
        run: |
          docker build \
            -t order-service:test \
            ./services/order-service
